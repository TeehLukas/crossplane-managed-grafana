# yaml-language-server: $schema=https://taskfile.dev/schema.json


version: '3'

vars:
  CLUSTER: crossplane-lab
  CONTEXT: kind-crossplane-lab
  ARGOCD_NAMESPACE: argocd
  ARGOCD_MANIFEST: https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

tasks:
  up:
    desc: Set up the local GitOps lab
    cmds:
      - task: cluster:create
      - task: argocd:bootstrap

  cluster:create:
    desc: Create the kind cluster
    cmds:
      - |
        kind create cluster --name {{.CLUSTER}} --config=- --wait 120s <<'EOF'
        apiVersion: kind.x-k8s.io/v1alpha4
        kind: Cluster
        nodes:
          - role: control-plane
            extraPortMappings:
              - containerPort: 30443
                hostPort: 8080
                listenAddress: "127.0.0.1"
                protocol: TCP
        EOF
    status:
      - kind get clusters | grep -qx {{.CLUSTER}}
    silent: true

  argocd:install:
    desc: Install Argo CD and wait for readiness
    cmds:
      - >-
        kubectl --context {{.CONTEXT}} create namespace {{.ARGOCD_NAMESPACE}} --dry-run=client -o yaml |
        kubectl --context {{.CONTEXT}} apply -f -
      - kubectl --context {{.CONTEXT}} -n {{.ARGOCD_NAMESPACE}} apply --server-side --force-conflicts -f {{.ARGOCD_MANIFEST}}
      - kubectl --context {{.CONTEXT}} wait --for=condition=Established crd/applications.argoproj.io --timeout=120s
      - kubectl --context {{.CONTEXT}} -n {{.ARGOCD_NAMESPACE}} rollout status deployment/argocd-repo-server --timeout=300s
      - kubectl --context {{.CONTEXT}} -n {{.ARGOCD_NAMESPACE}} rollout status statefulset/argocd-application-controller --timeout=300s
      - kubectl --context {{.CONTEXT}} -n {{.ARGOCD_NAMESPACE}} rollout status deployment/argocd-server --timeout=300s

  argocd:bootstrap:
    desc: Apply the Argo CD bootstrap manifest
    deps: [argocd:install]
    cmds:
      - kubectl --context {{.CONTEXT}} -n {{.ARGOCD_NAMESPACE}} apply -f bootstrap.yaml

  argocd:admin-password:
    desc: Print the initial Argo CD admin password
    silent: true
    cmds:
      - |
        password=$(kubectl --context {{.CONTEXT}} -n {{.ARGOCD_NAMESPACE}} get secret argocd-initial-admin-secret -o jsonpath='{.data.password}') || exit 1
        printf '%s' "$password" | base64 --decode && printf '\n'

  argocd:uninstall:
    desc: Remove Argo CD and its namespace
    cmds:
      - kubectl --context {{.CONTEXT}} -n {{.ARGOCD_NAMESPACE}} delete -f {{.ARGOCD_MANIFEST}}
      - kubectl --context {{.CONTEXT}} delete namespace {{.ARGOCD_NAMESPACE}}

  grafana:install:
    desc: Create and start the Grafana container
    cmds:
      - podman run -d --name my-grafana -p 3000:3000 docker.io/grafana/grafana:latest
    
  grafana:up:
    desc: Start the existing Grafana container
    cmds:
      - podman start my-grafana 


  status:
    desc: Show cluster and platform status
    cmds:
      - kubectl --context {{.CONTEXT}} get nodes
      - kubectl --context {{.CONTEXT}} get pods -n crossplane-system
      - kubectl --context {{.CONTEXT}} get providers.pkg.crossplane.io
      - kubectl --context {{.CONTEXT}} get crd applications.argoproj.io applicationsets.argoproj.io appprojects.argoproj.io

  down:
    desc: Delete local test cluster
    prompt: Delete the Crossplane test cluster?
    cmds:
      - kind delete cluster --name {{.CLUSTER}}

  reset:
    desc: Delete and rebuild the local lab
    cmds:
      - task: down
      - task: up

