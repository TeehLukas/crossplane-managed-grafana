# yaml-language-server: $schema=https://taskfile.dev/schema.json


version: '3'

vars:
  CLUSTER: crossplane-lab
  CONTEXT: kind-crossplane-lab
  CROSSPLANE_VERSION: 2.4.0

tasks:
  up:
    desc: Create cluster and install Crossplane
    cmds:
      - task: cluster:create
      - task: crossplane:install

  cluster:create:
    cmds:
      - kind create cluster --name {{.CLUSTER}} --wait 120s
    status:
      - kind get clusters | grep -qx {{.CLUSTER}}

  crossplane:install:
    cmds:
      - helm repo add crossplane-stable https://charts.crossplane.io/stable --force-update
      - helm upgrade --install crossplane crossplane-stable/crossplane --version {{.CROSSPLANE_VERSION}} --kube-context {{.CONTEXT}} --namespace crossplane-system --create-namespace --wait --timeout 5m

  status:
    cmds:
      - kubectl --context {{.CONTEXT}} get nodes
      - kubectl --context {{.CONTEXT}} get pods -n crossplane-system
      - kubectl --context {{.CONTEXT}} get providers.pkg.crossplane.io

  down:
    desc: Delete local test cluster
    prompt: Delete the Crossplane test cluster?
    cmds:
      - kind delete cluster --name {{.CLUSTER}}

  reset:
    desc: Recreate everything from scratch
    cmds:
      - task: down
      - task: up

