apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: root-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/TeehLukas/crossplane-managed-grafana.git
    targetRevision: main
    path: argocd/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
---
apiVersion: v1
kind: Secret
metadata:
  name: crossplane-managed-grafana-repository
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  url: https://github.com/TeehLukas/crossplane-managed-grafana.git
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-server-nodeport
  namespace: argocd
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: argocd-server
  ports:
    - name: https
      port: 443
      targetPort: 8080
      nodePort: 30443
--- # Grafana bootstrap
apiVersion: v1
kind: Namespace
metadata:
  name: grafana
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-credentials
  namespace: grafana
type: Opaque
stringData:
  credentials: |
    {
      "url": "http://169.254.1.2:3000/",
      "auth": "admin:admin123"
    }
---
apiVersion: grafana.m.crossplane.io/v1beta1
kind: ProviderConfig
metadata:
  name: grafana
  namespace: grafana
spec:
  credentials:
    source: Secret
    secretRef:
      name: grafana-credentials
      key: credentials
      namespace: grafana
