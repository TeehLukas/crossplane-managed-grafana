apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane-components
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/TeehLukas/crossplane-managed-grafana.git
    targetRevision: main
    path: crossplane
    #directory:
    #  exclude: initApplications.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: true