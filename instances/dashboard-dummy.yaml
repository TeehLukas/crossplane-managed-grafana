apiVersion: oss.grafana.m.crossplane.io/v1alpha1
kind: Dashboard
metadata:
  name: lab-dummy-dashboard
  namespace: grafana
  annotations:
    crossplane.io/poll-interval: "15s"
spec:
  forProvider:
    organizationRef:
      name: lab
      namespace: grafana
    message: "Dummy-Dashboard angelegt"
    overwrite: true
    configJson: |
      {
        "uid": "lab-dummy-dashboard",
        "title": "Dummy-Dashboard",
        "description": "Beispiel-Dashboard für die Grafana-Organisation",
        "tags": ["dummy", "lab"],
        "schemaVersion": 39,
        "timezone": "browser",
        "time": {
          "from": "now-6h",
          "to": "now"
        },
        "panels": [
          {
            "id": 1,
            "type": "text",
            "title": "Willkommen",
            "gridPos": {"h": 4, "w": 12, "x": 0, "y": 0},
            "options": {
              "mode": "markdown",
              "content": "## Beispieldaten\nDieses Panel benötigt keine Datenquelle."
            }
          }
        ]
      }
  providerConfigRef:
    kind: ProviderConfig
    name: grafana
