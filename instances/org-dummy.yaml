apiVersion: oss.grafana.m.crossplane.io/v1alpha1
kind: Organization
metadata:
  name: lab
  namespace: grafana
spec:
  forProvider:
    name: Dummy-Organization
    adminUser: admin
    createUsers: true
    admins:
      - org-admin@example.com
    editors:
      - org-editor@example.com
    viewers:
      - org-viewer@example.com
    usersWithoutAccess:
      - org-no-access@example.com
  providerConfigRef:
    kind: ProviderConfig
    name: grafana
